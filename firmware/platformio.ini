; Прошивка питомца для M5Stack Atom + Atomic Echo Base.
;
;   m5stack-atoms3   — универсальная сборка (работает и на AtomS3, и на AtomS3R),
;                      PSRAM не используется. Это сборка по умолчанию.
;   m5stack-atoms3r  — сборка под AtomS3R (ESP32-S3-PICO-1-N8R8): включает 8 МБ
;                      PSRAM, и буфер речи берётся оттуда — 6 секунд вместо 1.5.
;
; Собрать конкретную: pio run -e m5stack-atoms3r

; Задача Default собирает именно этот env (а не все сразу — параллельная сборка
; двух env в один каталог ломает линковку).
[platformio]
default_envs = m5stack-atoms3

[env]
; Версия платформы зафиксирована намеренно. Без пина сборка у двух человек
; могла взять разные ядра Arduino, а вместе с ними — разные драйверы I2S,
; и звук вёл себя по-разному без единой правки в коде.
platform = espressif32@7.0.1
framework = arduino
board = m5stack-atoms3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; У AtomS3/AtomS3R 8 МБ флеша: две области под прошивку (по 3.3 МБ) и место
; под данные. Вторая область нужна для обновления по воздуху.
board_build.partitions = default_8MB.csv

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Логи ядра выключены: по этому же USB идёт двоичный протокол,
	; и любая отладочная строка попадает прямо в поток аудио.
	-D CORE_DEBUG_LEVEL=0
	-D ENABLE_OTA

; Уровень оптимизации оставлен штатным (-Os). Пробовали -O2 ради float-математики
; в отрисовке: xtensa-gcc 8.4 падает на ней с internal compiler error
; (extract_constrain_insn, postreload) — баг аллокатора регистров FPU.
; Частота кадров всё равно ограничена сверху таймером, так что потери нет.
build_src_flags = -Wall -Wextra -Wno-unused-parameter

lib_deps =
	m5stack/M5Unified @ ^0.1.13
	links2004/WebSockets @ ^2.4.1
	bblanchon/ArduinoJson @ ^6.21.3

; Драйвер Atomic Echo Base лежит в lib/M5EchoBase и собирается из исходников.
; Раньше он подключался как file://-зависимость: PlatformIO копировал его в
; .pio/libdeps, и после удаления исходников сборка ещё долго «работала» из
; этой копии, а на чистой машине падала.

extra_scripts =
	pre:apply_env.py
	post:copy_bins.py

[env:m5stack-atoms3]

[env:m5stack-atoms3r]
board_build.arduino.memory_type = qio_opi
build_flags =
	${env.build_flags}
	-D BOARD_HAS_PSRAM
