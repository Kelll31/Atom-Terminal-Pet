# MCP-серверы, которые Атом поднимает при старте.
# Управлять списком удобнее из web-панели: вкладка «Инструменты» → «MCP-серверы».
#
# Формат записи:
#   имя:
#     command: node|npx|python|...
#     args: [...]
#     env: {КЛЮЧ: значение}     # необязательно
#     cwd: D:/путь              # необязательно, по умолчанию каталог backend
#     enabled: true
#     description: для чего сервер
mcpServers:
  web_search:
    command: node
    args:
      - node_modules/duckduckgo-websearch/build/index.js
    enabled: true
    description: Поиск в интернете через DuckDuckGo (без ключей API)
